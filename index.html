    <meta property="og:title" content="Shivam Pandey — Backend Developer" />
    <meta property="og:description" content="Backend Developer building secure authentication, multi-tenant architecture and scalable APIs." />
    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <title>Shivam Pandey — Backend Developer</title>

    <!-- Declared before the script below, which rewrites it to match the theme. -->
    <meta name="theme-color" content="#f7f8fc" />

    <script>
      // Apply the saved theme before first paint, otherwise a dark-mode
      // visitor gets a white flash while React boots.
      (function () {
        try {
          var saved = localStorage.getItem('theme')
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.setAttribute('data-theme', theme)
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute('content', theme === 'dark' ? '#08070c' : '#f7f8fc')
        } catch (e) {
          /* storage blocked — the stylesheet default (light) applies */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
